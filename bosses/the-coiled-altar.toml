# Mechanic reference for The Coiled Altar (Zul'jan and Malacrass), The Venomous Abyss.
# Sources: dungeon journal text via Warcraft Wiki, plus what the kill logs show.
# type:   burst = one hit raid-wide | dot = raid-wide over time | absorb = healing absorb to heal through
#         targeted = a few players | pool = avoidable ground damage | control = fear/stun/possess | tank = tank hit
# cover:  which cooldown kinds fit: throughput, sustained, dr (damage reduction), external, none
# weight: how much a healer cooldown is worth here, 0 to 3 (3 = must cover, 0 = ignore)

npcs = ["Zul'jan", "Malacrass", "Spiteful Soulcoiler", "Zul'jan the Twinfang", "Malacrass the Usurper"]

[[mechanic]]
name = "Fangs of the Coiled Altar"
phase = 1
type = "burst"
school = "Nature"
cover = ["dr", "throughput"]
weight = 3
notes = "Raid-wide Nature hit, boss gains Twinfang Toxin stacks. Main P1 healing moment. (Journal calls it Fangs of the Crucible; the log name is used here.)"

[[mechanic]]
name = "Toxic Deluge"
phase = 1
type = "dot"
school = "Nature"
cover = ["sustained"]
weight = 2
notes = "Coalesced Venom pools tick every 2s on anyone nearby. Sustained pressure, not a burst."

[[mechanic]]
name = "Guillotine"
phase = 1
type = "targeted"
school = "Nature"
cover = ["throughput"]
weight = 2
notes = "Split soak on a random target, needs 5+ players. Widow's Kiss/Touch eruptions. Heroic: 500% damage taken debuff for 100s on the soakers."

