# Major healer cooldowns tracked per spec.
# Keys are "<Spec> <Class>" exactly as Warcraft Logs names them.
# Each entry: name = spell name as it appears in logs, cd = cooldown in seconds,
# ids = known spell IDs (optional, matching falls back to name), tier = "major" or "minor".
# Minor cooldowns are analysed but not put on the raid note by default.
# kind = what the cooldown is for, used by the team coverage planner:
#   throughput = big burst of healing | sustained = healing over 10s+ (HoTs, forms, celestials)
#   dr = raid-wide damage reduction or equalising | external = single target save
#   personal = only saves the caster | mana | utility. Only throughput/sustained/dr/external get planned.
# If Blizzard renames or re-IDs something, fix the name here or let discover_unlisted find it.

